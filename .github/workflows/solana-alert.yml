name: Solana Project Trader

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: solana-project-trader
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate configuration
        run: |
          python -m py_compile command_runner.py main.py market.py learner.py news_analyzer.py adaptive_policy.py self_improver.py signal_quality.py strategy_ensemble.py
          python -c "import json; json.load(open('data/projects.json', encoding='utf-8'))"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_LIQUIDITY_USD: "100000"
          MIN_PROBABILITY: "0.60"
          MAX_STOP_PCT: "0.05"
          TARGET_PCT: "0.10"
          MAX_DISCOVERED_PROJECTS: "100"
          ALERT_COOLDOWN_HOURS: "6"
        run: python command_runner.py
      - name: Save persistent history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update bot history"
            # A manual code commit can land while this scheduled run is active.
            # Rebase the generated data commit onto the newest branch before pushing.
            git fetch origin "${{ github.ref_name }}"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
