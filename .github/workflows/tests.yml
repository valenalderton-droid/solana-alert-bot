name: Bot Code Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile main.py market.py learner.py
      - name: Validate project config
        run: python -c "import json; d=json.load(open('data/projects.json', encoding='utf-8')); assert isinstance(d.get('projects'), list)"
